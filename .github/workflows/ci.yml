name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs this one first, so a tag never publishes
  # an image from a commit that does not pass.
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR so only the latest commit's
# checks keep running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by major version tag and kept current by
      # Dependabot (.github/dependabot.yml); see docs/adr/0017 for why
      # they are not pinned by commit digest yet.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      - name: go mod tidy diff check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  container:
    name: container (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [conductor, runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute build date
        id: build_date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Build only — this workflow never pushes images. The release
      # workflow (release.yml) pushes to ghcr.io on a version tag.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: false
          load: true
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
          tags: ghcr.io/cits-nue/acme-${{ matrix.component }}:ci

      - name: Smoke test --version
        run: |
          out="$(docker run --rm --read-only --user 65532:65532 \
            ghcr.io/cits-nue/acme-${{ matrix.component }}:ci --version)"
          echo "$out"
          case "$out" in
            acme-${{ matrix.component }}*) ;;
            *)
              echo "unexpected --version output: $out" >&2
              exit 1
              ;;
          esac

      - name: Smoke test bundled lego --version
        if: matrix.component == 'runner'
        run: |
          out="$(docker run --rm --read-only --user 65532:65532 \
            --entrypoint /usr/local/bin/lego \
            ghcr.io/cits-nue/acme-runner:ci --version)"
          echo "$out"
          case "$out" in
            *"lego version 4.35.2"*) ;;
            *)
              echo "unexpected lego --version output: $out" >&2
              exit 1
              ;;
          esac
